spring:
  application:
    name: moneyjar
  datasource:
    url: jdbc:mysql://localhost:3307/moneyjar?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
    username: root
    password: 1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8009

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){black} %clr(%5p) %clr([%t]){magenta} %clr(%logger{36}){cyan} %clr(:){faint} %msg%n"

encrypt:
  config:
    secret: my128bitSecretKe
